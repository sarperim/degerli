# Continuous deployment (architecture 01-system-architecture.md §6.2, §6.3;
# TKT-int-006; ordered deploy + pre-deploy marker + readiness gate,
# TKT-foundation-067).
#
# Fires only after the CI workflow completes successfully on `main`, then:
#   1. builds + pushes the production images to public GHCR
#      (ghcr.io/sarperim/degerli/api + .../web, tagged :<sha> and :latest);
#   2. SSHs to the VPS and runs the deploy in a fixed, fail-stop order:
#      preflight → pull → pre-deploy restore-point marker → `api migrate` (one-shot)
#      → readiness gate (`up -d --wait`, Caddy starts only against a healthy API)
#      → smoke-check `GET /health` through Caddy.
#
# Any phase failing aborts the deploy *there*, before the next one starts, and the job
# prints the recovery path for that phase. Nothing is rolled back automatically: the
# migrations are forward-only (02-data-model.md §8), so the correct recovery depends on
# whether the schema moved — see deploy/README.md §Rollback posture (the standing rule
# is expand → migrate → contract).
#
# Rollback is a re-deploy of the previous image tag: run this workflow manually
# (workflow_dispatch) with the prior short SHA — compose.prod.yml is tag-pinned, so
# `up -d` pulls and restarts exactly that image — and that is safe only while the
# release's schema change is still in its expand phase. See deploy/README.md.
#
# NOTE: `workflow_run` requires this file to exist on the default branch, so CD only
# becomes active once this workflow is merged to `main`.
#
# Required repository secrets: SSH_PRIVATE_KEY, DEPLOY_HOST, DEPLOY_USER,
#   DEPLOY_HOST_KEY (the VPS host's known_hosts line — see deploy/README.md §Secrets).
# Required repository variables: DEPLOY_PATH (checkout dir on the VPS),
#   PUBLIC_URL (e.g. https://degerli.example). No secret is ever written to the repo.

name: Deploy

on:
  # Runs after the "CI" workflow finishes; the job below gates on a green run on main.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual (re)deploy of a specific image tag — the documented rollback path.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag/SHA to (re)deploy (rollback)."
        required: true
        type: string

# Least privilege: `packages: write` is granted only to the image build/push job
# below; the SSH deploy job needs nothing beyond reading the repo.
permissions:
  contents: read

# Never run two deploys at once; do not cancel an in-flight deploy.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/sarperim/degerli/api
  WEB_IMAGE: ghcr.io/sarperim/degerli/web

jobs:
  # ---------------------------------------------------------------------------
  # Build + push both production images for this commit.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & push images
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pushing to GHCR needs package write; scoped to this job only.
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout the deployed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The github.sha of a workflow_run is the default branch; deploy the exact
          # commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Derive image tag
        id: meta
        run: echo "tag=$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: src/Api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web (Caddy + SPA) image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/caddy/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Pull → verify a restore point → migrate → readiness gate → smoke-check.
  # Every phase aborts the deploy before the next one runs (TKT-foundation-067).
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy over SSH
    needs: [build-and-push]
    # Run after a successful build, or on a manual rollback dispatch.
    if: >-
      always()
      && (needs.build-and-push.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve the image tag
        id: tag
        env:
          # Passed via env (not inline interpolation) so a dispatch input cannot
          # inject shell into this step.
          DISPATCH_TAG: ${{ inputs.image_tag }}
          BUILD_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            value="${DISPATCH_TAG}"
          else
            value="${BUILD_TAG}"
          fi
          # Guard: image tags are short/long hex SHAs only.
          if ! printf '%s' "$value" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::refusing to deploy with a non-SHA image tag: '${value}'"
            exit 1
          fi
          echo "value=${value}" >> "$GITHUB_OUTPUT"

      - name: Deploy on the VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail

          # Fail fast rather than SSH with empty coordinates.
          : "${SSH_PRIVATE_KEY:?secret SSH_PRIVATE_KEY is required}"
          : "${DEPLOY_HOST:?secret DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?secret DEPLOY_USER is required}"
          : "${DEPLOY_HOST_KEY:?secret DEPLOY_HOST_KEY is required}"
          : "${DEPLOY_PATH:?repository variable DEPLOY_PATH is required}"
          : "${PUBLIC_URL:?repository variable PUBLIC_URL is required}"
          : "${IMAGE_TAG:?no image tag resolved}"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pin the VPS host key from a secret (no TOFU). DEPLOY_HOST_KEY is the full
          # known_hosts line for the deploy host, e.g. "degerli.example ssh-ed25519 AAAA…".
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # The remote script is read from stdin ('bash -s'); the tag and public URL
          # are passed as positional args so nothing secret touches the shell history.
          # StrictHostKeyChecking=yes fails closed unless the host matches the pin.
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              bash -s -- "$IMAGE_TAG" "$PUBLIC_URL" "$DEPLOY_PATH" <<'REMOTE'
            set -euo pipefail
            IMAGE_TAG="$1"
            PUBLIC_URL="$2"
            DEPLOY_PATH="$3"
            export IMAGE_TAG

            cd "$DEPLOY_PATH"

            COMPOSE="docker compose -f compose.prod.yml"

            # Fixed tunables. This body is a quoted heredoc over `ssh … bash -s` and it
            # never sources the VPS `.env`, so setting these there has NO effect — change
            # them here (deploy/README.md §Backups says so too). The backup age bound is
            # the documented RPO (01 §10.8): the restore point a forward-only migration
            # relies on may not be older than that.
            : "${PRE_DEPLOY_BACKUP_DIR:=${DEPLOY_PATH}/backups}"
            : "${PRE_DEPLOY_MAX_BACKUP_AGE_HOURS:=24}"
            : "${READINESS_TIMEOUT_SECONDS:=180}"

            phase="preflight"

            # --- failure posture ----------------------------------------------------
            # Each phase runs only after the previous one succeeded, so a failure stops
            # the deploy *there* — before the next (more destructive) step. Nothing is
            # rolled back automatically: migrations are forward-only (02 §8), which
            # makes the correct recovery depend on whether the schema already moved.
            # The message therefore names the phase, the tag still serving, and the
            # recorded recovery path (deploy/README.md §Rollback posture).
            on_failure() {
              rc=$?
              echo "::error::deploy FAILED in phase '${phase}' (exit ${rc})."
              ${COMPOSE} ps || true
              echo ""
              echo "==> RECOVERY — nothing was rolled back automatically."
              case "${phase}" in
                preflight|pull|backup-marker)
                  echo "    The running stack was not touched; the old stack is still serving${previous_tag:+ (tag ${previous_tag})}."
                  echo "    Fix the cause and re-run the Deploy workflow."
                  ;;
                migrate)
                  echo "    The migration FAILED. The serving stack was not replaced${previous_tag:+ — the old image (tag ${previous_tag}) is still running} — but the schema may have PARTIALLY moved:"
                  echo "    `api migrate` applies EVERY pending migration in one run, each committed in its own transaction, so every migration before the failing one is already committed."
                  echo "    Check __EFMigrationsHistory before choosing: fix forward with a corrective migration (the normal path), or restore the pre-deploy restore point (lossy to the RPO, deploy/README.md §Backups)."
                  echo "    Re-deploying the previous tag does NOT undo those committed migrations."
                  ;;
                ready|smoke)
                  echo "    The schema IS migrated and the stack was replaced, but the new one did not become ready or did not serve."
                  echo "    THE PUBLIC ENTRYPOINT IS NOT SERVING — this is a full outage, not a paused deploy. Recover now:"
                  echo "    re-deploy the previous tag${previous_tag:+ (${previous_tag})} ONLY if this release's change is still expand-phase (backward compatible)."
                  echo "    Otherwise restore the pre-deploy restore point — an image rollback cannot undo a schema change."
                  ;;
              esac
              exit "${rc}"
            }
            trap on_failure ERR

            # The tag that is serving right now, read *before* anything is replaced, so a
            # failure names the exact rollback target instead of "some previous SHA".
            previous_tag=""
            running_container="$(${COMPOSE} ps -q api 2>/dev/null | head -n1 || true)"
            if [ -n "${running_container}" ]; then
              previous_image="$(docker inspect --format '{{.Config.Image}}' "${running_container}" 2>/dev/null || true)"
              # Only a tag on the last path segment is a usable rollback target. A
              # digest-pinned ref (`repo@sha256:…`) has no tag, and a registry-port ref
              # (`host:5000/repo`) must not be truncated into "5000/repo" — this value
              # ends up inside the rollback instruction, so a mangled one is worse than none.
              case "${previous_image}" in
                *@*) : ;;
                *)
                  last_segment="${previous_image##*/}"
                  case "${last_segment}" in
                    *:*) previous_tag="${last_segment##*:}" ;;
                  esac
                  ;;
              esac
            fi

            echo "==> [preflight] deploying ${IMAGE_TAG} (serving now: ${previous_tag:-none}) from ${DEPLOY_PATH}"
            case "${PRE_DEPLOY_MAX_BACKUP_AGE_HOURS}" in
              ''|*[!0-9]*) echo "::error::PRE_DEPLOY_MAX_BACKUP_AGE_HOURS must be a whole number of hours, got '${PRE_DEPLOY_MAX_BACKUP_AGE_HOURS}'"; false ;;
            esac
            for required in compose.prod.yml .env; do
              if [ ! -f "${required}" ]; then echo "::error::${DEPLOY_PATH}/${required} is missing"; false; fi
            done
            command -v docker >/dev/null || { echo "::error::docker is required on the deploy host"; false; }
            command -v curl >/dev/null || { echo "::error::curl is required for the smoke-check"; false; }
            # Validates the file (and the required .env variables) before anything moves;
            # `up --wait` (the readiness gate) needs Compose v2.
            ${COMPOSE} config -q

            # DEGERLI_BUILDER_PASSWORD is required by the seed SQL the `migrate` step
            # generates (src/Persistence/Seed/DegerliSeed) and by nothing at request time,
            # so it is NOT in the serving container's environment (compose.prod.yml) and
            # therefore not in `compose config`. Required here instead — presence AND the
            # same 12-char minimum the seed enforces (DegerliSeed.MinimumBuilderPasswordLength)
            # — so a missing or too-short value fails at preflight, never mid-migration.
            # Parsed the way Compose reads `.env` (last assignment wins, optional quotes);
            # the script never sources `.env`.
            builder_password="$(sed -n 's/^[[:space:]]*DEGERLI_BUILDER_PASSWORD[[:space:]]*=[[:space:]]*//p' .env | tail -n1 | tr -d '\r')"
            builder_password="${builder_password%\"}"; builder_password="${builder_password#\"}"
            builder_password="${builder_password%\'}"; builder_password="${builder_password#\'}"
            if [ -z "${builder_password}" ]; then
              echo "::error::DEGERLI_BUILDER_PASSWORD is missing from ${DEPLOY_PATH}/.env — the migrate step seeds the builder bootstrap account and in a deployed environment it has no default (CWE-798)."
              false
            fi
            if [ "${#builder_password}" -lt 12 ]; then
              echo "::error::DEGERLI_BUILDER_PASSWORD is ${#builder_password} chars but the enforced minimum is 12 (DegerliSeed.MinimumBuilderPasswordLength) — migrate would abort mid-run. Fix .env and re-run."
              false
            fi

            phase="pull"
            echo "==> [pull] pulling images for tag ${IMAGE_TAG}"
            ${COMPOSE} pull

            # --- pre-deploy restore-point marker ------------------------------------
            # A forward-only migration has no down path, so the only honest undo is a
            # restore point. This step REFUSES to deploy without one that is inside the
            # RPO; it takes no new backup itself (that is deploy/backup/pg-backup.sh,
            # TKT-foundation-076's drill) and it records what it verified, so the deploy
            # log carries the restore point it relied on.
            #
            # Bootstrap carve-out (first deploy on a blank host): there is nothing to
            # restore yet, and pg-backup.sh dumps out of a RUNNING postgres container that
            # does not exist until the stack has been brought up once — so requiring an
            # archive here would deadlock the very first deploy (deploy/README.md
            # §First-time VPS setup). Bootstrap is detected from the absence of the compose
            # project's `postgres-data` volume, the only durable marker of "this host has
            # never held a database". As soon as that volume exists — every later deploy,
            # including a box whose stack is currently down — the no-override gate below
            # applies unchanged.
            phase="backup-marker"
            compose_project="${COMPOSE_PROJECT_NAME:-degerli}"   # compose.prod.yml pins `name: degerli`
            volume_list=""
            if ! volume_list="$(docker volume ls -q \
                 --filter "label=com.docker.compose.project=${compose_project}" \
                 --filter 'label=com.docker.compose.volume=postgres-data')"; then
              echo "::error::could not inspect docker volumes to decide bootstrap vs restore-point gate — refusing to guess"
              false
            fi
            postgres_volume="$(printf '%s\n' "${volume_list}" | head -n1)"
            bootstrap=false
            newest=""
            age_hours="n/a"
            if [ -z "${postgres_volume}" ]; then
              bootstrap=true
              restore_point_label="none (bootstrap)"
              echo "==> [backup-marker] bootstrap deploy: no postgres data volume on this host yet — nothing to restore, no archive required (marker records bootstrap=true)"
            else
              restore_point_label=""
              echo "==> [backup-marker] requiring a restore point in ${PRE_DEPLOY_BACKUP_DIR} no older than ${PRE_DEPLOY_MAX_BACKUP_AGE_HOURS}h"
              newest_mtime=0
              for candidate in "${PRE_DEPLOY_BACKUP_DIR}"/degerli-*.dump.gpg; do
                [ -f "${candidate}" ] || continue
                mtime="$(stat -c %Y "${candidate}")"
                if [ "${mtime}" -gt "${newest_mtime}" ]; then
                  newest="${candidate}"
                  newest_mtime="${mtime}"
                fi
              done
              if [ -z "${newest}" ]; then
                echo "::error::no backup archive (degerli-*.dump.gpg) in ${PRE_DEPLOY_BACKUP_DIR} — refusing to run a forward-only migration with no restore point. Run deploy/backup/pg-backup.sh first (deploy/README.md §Backups). Its BACKUP_DIR (from /etc/degerli/backup.env) must be the same directory as PRE_DEPLOY_BACKUP_DIR; both default to /opt/degerli/backups."
                false
              fi
              if [ ! -s "${newest}" ]; then
                echo "::error::newest backup archive ${newest} is empty — it is not a restore point"
                false
              fi
              age_seconds=$(( $(date -u +%s) - newest_mtime ))
              age_hours=$(( age_seconds / 3600 ))
              if [ "${age_seconds}" -gt $(( PRE_DEPLOY_MAX_BACKUP_AGE_HOURS * 3600 )) ]; then
                echo "::error::newest restore point ${newest} is ${age_hours}h old (> ${PRE_DEPLOY_MAX_BACKUP_AGE_HOURS}h RPO) — run deploy/backup/pg-backup.sh first. Its BACKUP_DIR (from /etc/degerli/backup.env) must be the same directory as PRE_DEPLOY_BACKUP_DIR; both default to /opt/degerli/backups."
                false
              fi
              restore_point_label="$(basename "${newest}")"
            fi
            # `outcome` is the ATTEMPT; it is flipped to `success` only after the
            # smoke-check passes (see the end of this script), so a marker left at
            # `attempt` means the tag may never have served.
            mkdir -p "${PRE_DEPLOY_BACKUP_DIR}"
            marker="${PRE_DEPLOY_BACKUP_DIR}/predeploy-${IMAGE_TAG}-$(date -u +%Y%m%dT%H%M%SZ).marker"
            printf 'deploy_tag=%s\nrestore_point=%s\nrestore_point_age_hours=%s\nbootstrap=%s\noutcome=attempt\nverified_at=%s\n' \
              "${IMAGE_TAG}" "${restore_point_label}" "${age_hours}" "${bootstrap}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "${marker}"
            echo "    restore point: ${restore_point_label} (${age_hours}h old); marker: $(basename "${marker}")"

            # --- migrate (one-shot, the running stack is untouched) ------------------
            # The builder password is passed to this one-shot container only: it is a
            # seed input, not a serving-time setting (compose.prod.yml keeps it out of the
            # long-lived `api` environment). `-e VAR` (no value) copies it from this shell's
            # environment, so the credential never lands in the host's argument list.
            phase="migrate"
            echo "==> [migrate] applying forward-only EF migrations in a one-shot container"
            export DEGERLI_BUILDER_PASSWORD="${builder_password}"
            unset builder_password
            ${COMPOSE} run --rm -e DEGERLI_BUILDER_PASSWORD api migrate
            unset DEGERLI_BUILDER_PASSWORD

            # --- readiness gate -----------------------------------------------------
            # `--wait` makes this block until every service reports running/healthy or
            # fail inside the bounded window. The API's healthcheck in compose.prod.yml
            # is what makes Caddy's `depends_on: condition: service_healthy` real, so
            # Caddy is not started against an API that has not reported ready.
            phase="ready"
            echo "==> [ready] replacing the stack; the readiness gate bounds this at ${READINESS_TIMEOUT_SECONDS}s"
            ${COMPOSE} up -d --wait --wait-timeout "${READINESS_TIMEOUT_SECONDS}"

            # --- smoke-check through the public entrypoint --------------------------
            phase="smoke"
            echo "==> [smoke] checking ${PUBLIC_URL}/health through Caddy"
            # Per-attempt timeouts (5 s total, 3 s to connect) so a Caddy upstream that
            # accepts and then stalls cannot hang one attempt indefinitely: every attempt
            # is bounded, so the 30-attempt ceiling is a real bound and not the job timeout.
            code=""
            for attempt in $(seq 1 30); do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 --connect-timeout 3 "${PUBLIC_URL}/health" || true)"
              if [ "${code}" = "200" ]; then
                echo "    ${PUBLIC_URL}/health answered 200 on attempt ${attempt}"
                break
              fi
              sleep 5
            done
            if [ "${code}" != "200" ]; then
              echo "::error::smoke-check FAILED: ${PUBLIC_URL}/health returned '${code:-none}' after 30 attempts (each bounded at 5 s)"
              false
            fi

            # The marker was written at phase 3, i.e. it records the ATTEMPT. Flip it to
            # the outcome now that this tag has actually served traffic, so "the last good
            # tag" can be read straight from the markers (deploy/README.md §Rollback posture).
            sed -i 's/^outcome=attempt$/outcome=success/' "${marker}"
            printf 'smoke_ok_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${marker}"

            phase="done"
            echo "==> deploy complete: tag ${IMAGE_TAG} (was ${previous_tag:-none}), restore point ${restore_point_label:-none}"
            # Informational only: the deploy already succeeded, so a `ps` hiccup must not
            # be reported as a deploy failure (phase is `done`).
            ${COMPOSE} ps || true
          REMOTE
