# Production stack (architecture 01-system-architecture.md §5/§6.2, TKT-int-006;
# ordered deploy + readiness gate, TKT-foundation-067).
#
#   docker compose -f compose.prod.yml pull
#   # ... pre-deploy restore-point marker (deploy/README.md §Deploying) ...
#   docker compose -f compose.prod.yml run --rm -e DEGERLI_BUILDER_PASSWORD api migrate
#   docker compose -f compose.prod.yml up -d --wait --wait-timeout 180
#
# The builder password is a `migrate`-only input, exported from the VPS `.env` and passed
# to that one-shot run by name (-e VAR, no value) rather than kept in the long-lived `api`
# environment (see the anchor comment below).
#
# The order is the contract: images pulled, the restore point verified, the schema
# migrated by a one-shot container, and only then the running stack replaced. `--wait`
# is the readiness gate — the API's `healthcheck:` below is what makes Caddy's
# `depends_on: api: condition: service_healthy` satisfiable, so Caddy is not (re)started
# against an API that has not reported ready, and `up` fails within the bounded window
# instead of returning success on a stack that is still starting.
#
# Runs on the Hetzner VPS from the deploy job in .github/workflows/deploy.yml. Images
# are pulled from public GHCR (`ghcr.io/sarperim/degerli/api` + `.../web`) — the VPS
# needs no registry credentials (architecture §5/§6.3). All secrets come from the
# git-ignored VPS `.env` (see .env.example); the repo and the images carry none.
#
# Rollback = pin IMAGE_TAG to the previous image SHA and `up -d` again, *and* only
# inside the expand→migrate→contract rule for schema changes — see deploy/README.md
# §Rollback posture. Not to be confused with compose.dev.yml (hot-reload local dev) or
# compose.ci.yml (CI e2e stack).

name: degerli

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  ConnectionStrings__Default: ${ConnectionStrings__Default:?set ConnectionStrings__Default in .env}
  # DEGERLI_BUILDER_PASSWORD is deliberately NOT part of this shared anchor: its only
  # consumer is the seed SQL the one-shot `migrate` run generates (src/Persistence/Seed/
  # DegerliSeed — in a deployed environment it has no default by design, CWE-798). The
  # serving API never reads it, so it must not sit in the long-lived, internet-exposed
  # `api` container's environment (docker inspect / /proc/1/environ). deploy.yml reads it
  # from the VPS `.env`, enforces the 12-char minimum at `preflight`, and passes it only
  # to `run --rm -e … api migrate`. Surfaced by TKT-foundation-067's review round 1.
  Smtp__Host: ${Smtp__Host:?set Smtp__Host in .env}
  Smtp__Port: ${Smtp__Port:-587}
  Smtp__User: ${Smtp__User}
  Smtp__Password: ${Smtp__Password}
  Smtp__From: ${Smtp__From:?set Smtp__From in .env}
  Smtp__UseStartTls: ${Smtp__UseStartTls:-true}
  Evren__ApiKey: ${Evren__ApiKey}
  APP_URL: ${APP_URL:?set APP_URL in .env}
  ALERT_EMAIL: ${ALERT_EMAIL:?set ALERT_EMAIL in .env}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-degerli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-degerli}
    # No published port: the database is reachable only on the compose network
    # (backups run through `docker compose exec`).
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-degerli} -d ${POSTGRES_DB:-degerli}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ${API_IMAGE:-ghcr.io/sarperim/degerli/api}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *api-environment
    # Internal only; Caddy is the single public entrypoint.
    expose:
      - "8080"
    # The readiness gate (TKT-foundation-067). Caddy below declares
    # `depends_on: api: condition: service_healthy`; without this block that condition
    # is unsatisfiable and `up -d` is not a readiness gate at all. `/health` is the
    # liveness + DB probe (§10.3) — a container that cannot reach Postgres is not ready
    # to take traffic. curl ships in the API image (src/Api/Dockerfile), the same probe
    # compose.ci.yml uses. Bounded: 30 s start period + 6 × ~15 s ≈ 120 s worst case,
    # under the deploy's `--wait-timeout 180`.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  caddy:
    image: ${WEB_IMAGE:-ghcr.io/sarperim/degerli/web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
